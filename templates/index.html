<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 flex flex-col items-center">
    <div class="max-w-xl w-full bg-slate-800 p-8 rounded-xl shadow-lg mt-10 border border-slate-700">
        <h1 class="text-2xl font-bold text-center text-indigo-400 mb-6">Social Media Finder</h1>
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Tipe Pencarian</label>
                <select name="query_type" class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-indigo-500">
                    <option value="name">Nama Lengkap / Username</option>
                    <option value="phone">Nomor HP</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1">Target / Input</label>
                <input type="text" name="query" placeholder="Contoh: Budi Santoso atau 081234567890" required class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-semibold transition">Cari Media Sosial</button>
        </form>

        {% if results %}
        <div class="mt-8 border-t border-slate-700 pt-6">
            <h2 class="text-lg font-semibold mb-4">Hasil Tautan Profil untuk: <span class="text-indigo-400">{{ query }}</span></h2>
            <div class="space-y-3">
                {% for item in results %}
                <div class="flex items-center justify-between bg-slate-700 p-3 rounded-lg">
                    <span class="font-medium">{{ item.platform }}</span>
                    <a href="{{ item.link }}" target="_blank" class="text-xs bg-indigo-500 hover:bg-indigo-400 text-white py-1.5 px-3 rounded-md transition">Buka Tautan</a>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
